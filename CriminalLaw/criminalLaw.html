<!DOCTYPE html>
<html lang="en">
<head>

    <title>Criminal Laws (India) | Single Page Grid with Popups</title>
    <link rel="stylesheet" href="criminalLaws.css">
</head>
<body>

    <header class="header">
        <div class="header-container">
            <a href="#" class="back-link">&larr; Back to Home</a>

                <button class="header-button">9 ARTICLES</button>
            </div>
        </div>

    <main class="main-content">

            <span class="close-button" id="close-modal">&times;</span>
